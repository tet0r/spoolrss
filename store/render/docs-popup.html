<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 380px; height: 590px; overflow: hidden; background: #fff; }
    body { font: 13px "Segoe UI", system-ui, sans-serif; }
    /* The browser's toolbar, with only the SpoolRSS button. Placed from the left: headless Chrome lays pages out at least 500px wide. */
    .bar { width: 380px; height: 44px; background: #f1f3f6; border-bottom: 1px solid #e3e5e8; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; }
    .ext { position: relative; width: 30px; height: 30px; border-radius: 6px; background: #dfe7f7; display: grid; place-items: center; }
    .ext img { width: 18px; height: 18px; }
    .badge { position: absolute; right: -6px; bottom: -3px; background: #1f6feb; color: #fff; font-size: 9.5px; font-weight: 700; border-radius: 7px; padding: 0 4px; line-height: 13px; }
    .popup { position: absolute; top: 50px; left: 28px; width: 340px; height: 528px; border: 0; border-radius: 10px; background: #fff;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .2), 0 0 0 1px rgba(15, 23, 42, .06); }
  </style>
</head>
<body>
  <div class="bar"><div class="ext"><img src="/ext/icons/icon-32.png" alt=""><span class="badge">24</span></div></div>
  <iframe class="popup" src="/ext/popup.html" title="SpoolRSS popup"></iframe>
</body>
</html>
