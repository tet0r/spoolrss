<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body {
      font: 16px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: #1d2228;
      background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 55%, #e8f0fe 100%);
      display: grid; grid-template-columns: 520px 1fr; align-items: center;
    }
    .copy { padding: 0 40px 0 80px; }
    h1 { font-size: 40px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 22px; }
    p { font-size: 18px; color: #4b525c; margin: 0 0 14px; }
    .frame { width: 640px; height: 760px; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 24px 60px rgba(15, 23, 42, .18), 0 0 0 1px rgba(15, 23, 42, .06); }
  </style>
</head>
<body>
  <div class="copy">
    <h1>Connects to your own feed reader</h1>
    <p>SpoolRSS, FreshRSS, Miniflux, Tiny Tiny RSS, Nextcloud News, or any reader with a Google Reader or Fever API.</p>
    <p>The extension can only reach the address you enter, and you choose how often it checks.</p>
  </div>
  <iframe class="frame" src="/ext/options.html" title="SpoolRSS extension settings"></iframe>
</body>
</html>
