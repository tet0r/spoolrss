services:
  spoolrss:
    # Prebuilt image published from GitHub on every push to main.
    # To build from a local checkout instead, replace this line with `build: .`
    image: ghcr.io/tet0r/spoolrss:latest
    container_name: spoolrss
    restart: unless-stopped
    # Run a tiny init as PID 1 so `docker compose down` stops the app immediately.
    init: true
    ports:
      - "${SPOOLRSS_PORT:-8080}:8080"
    environment:
      # Set SPOOLRSS_PASSWORD (in a .env file, or your stack's environment variables)
      # to require sign-in. Strongly recommended if exposed beyond your LAN.
      SPOOLRSS_PASSWORD: ${SPOOLRSS_PASSWORD:-}
      SPOOLRSS_REFRESH_MINUTES: ${SPOOLRSS_REFRESH_MINUTES:-15}
      SPOOLRSS_RETENTION_DAYS: ${SPOOLRSS_RETENTION_DAYS:-90}
      # Check GitHub every 5 minutes for a newer release and show a banner.
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      TZ: ${TZ:-UTC}
    volumes:
      - spoolrss-data:/data
    healthcheck:
      # style.css is served without sign-in, so this works with a password set.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/style.css"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  spoolrss-data:
